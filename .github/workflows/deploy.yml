name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Set up once (README "Auto-deploy from GitHub"). Accepts the secret name that
      # `firebase init hosting:github` creates, or a manually added FIREBASE_SERVICE_ACCOUNT.
      # Until one exists, this job builds and skips the deploy.
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GUJARAT_LAND_DEALS_AHIR || secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      # The project comes from .firebaserc (gujarat-land-deals-ahir).
      - name: Deploy
        if: ${{ env.SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.SERVICE_ACCOUNT }}
          channelId: live

      - name: Deploy skipped
        if: ${{ env.SERVICE_ACCOUNT == '' }}
        run: echo "::notice::No Firebase service account secret yet, so the site was built but not deployed. See README 'Auto-deploy from GitHub'."
